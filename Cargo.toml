[package]
name = "arrow"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14.0", features = ["advanced", "canvas", "tokio"] }
ropey = "1.6"
pyo3 = { version = "0.27", features = ["auto-initialize"] }
tree-sitter = "0.27.2"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
streaming-iterator = "0.1.9"
serde_json = "1.0"
url = "2.5"
tokio = { version = "1", features = ["rt", "sync"] }
