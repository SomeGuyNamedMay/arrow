[package]
name = "arrow"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "plugins/core", "plugins/text-tools"]
# Plugins target wasm32-wasip2 and are built by build.rs, so plain `cargo build`
# and `cargo test` only cover the editor itself.
default-members = ["."]

[dependencies]
iced = "0.14.0"
wasmtime = "50.0.2"
wasmtime-wasi = "50.0.2"
